["tacz:db_short".muzzle]
title = "Bullet origin"
color = "#FF4444"
hint = "Align the origin marker with the front of the muzzle. Check impact alignment at close range after saving."

["tacz:db_short".support]
title = "Support aim - BLUE"
color = "#5599FF"
hint = "Place the empty offhand inside the blue region to support aim. Button-only guns do not require Grab."

["tacz:db_short".sight]
title = "ADS alignment - PURPLE"
color = "#BB55FF"
hint = "Align the purple sight region with the eye position when naturally looking along the sights. Eye alignment activates ADS; two-hand ADS also needs support."

["tacz:db_short".port]
title = "Ejection position - PINK"
color = "#FF3388"
hint = "Place the pink point at the ejection port. This adjusts cosmetic ejection placement, not a physical grab on button-only guns."

