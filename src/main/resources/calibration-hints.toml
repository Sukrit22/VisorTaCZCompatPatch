# Per-gun calibration text and guide RGB colors. Edit here, then rebuild the JAR.
# Supported actions/pages are defined in CalibrationLayout.java, not enabled by this file.
# Box size uses full width/height/depth in metres in JSON, millimetres in the menu.

["tacz:glock_17".grip]
title = "Grip position"
color = "#FFFFFF"
hint = "Align the firing hand with the grip. X right, Y up, Z back. Offsets remain visible."

["tacz:glock_17".rotation]
title = "Grip rotation"
color = "#FFFFFF"
hint = "Rotate the gun to follow your controller. Pitch, yaw and roll are degrees."

["tacz:glock_17".scale]
title = "Gun size"
color = "#FFFFFF"
hint = "Uniform scale around the firing-hand grip. 100% is the original size. Lock links gun boxes to scale changes; unlock keeps their sizes. Pouch stays independent."

["tacz:glock_17".muzzle]
title = "Bullet origin - CYAN"
color = "#55FFFF"
hint = "Place the small cyan marker at the muzzle opening. Negative Z moves forward. This adjusts bullet origin."

["tacz:glock_17".magazine]
title = "Magazine - GREEN"
color = "#33FF55"
hint = "Grab inside the green box and pull down. Bring a replacement here and release to insert."

["tacz:glock_17".rack]
title = "Slide - ORANGE"
color = "#FF9900"
hint = "Grab in the orange box, pull the slide rearward, then release. A loaded chamber ejects one live round."

["tacz:glock_17".pouch]
title = "Ammo pouch - CYAN"
color = "#33FFFF"
hint = "Hold Grab in this head-yaw-aligned box to take a preview. Inventory ammo is checked on insertion."

["tacz:glock_17".sight]
title = "ADS alignment - PURPLE"
color = "#DD44FF"
hint = "Place the purple point on the sight line. Put either eye inside the box behind it and look down the barrel. This controls ADS, not scope glass."

["tacz:glock_17".port]
title = "Ejection / casing grab - PINK"
color = "#FF3388"
hint = "Place the pink point at the ejection port. During a stovepipe, grab in its box and pull the casing away."

