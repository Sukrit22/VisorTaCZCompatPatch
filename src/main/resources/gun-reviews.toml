# Human calibration verification, separate from the executable gun profiles.
# Edit config/visor_tacz/gun-reviews.toml; Reload calibration applies edits.
# B/P/AH are derived from actual loaded profiles, never from this file.
schema = 1

[[packs]]
id = "base"
name = "TaCZ base pack"

# Copy this block for every gun you personally checked. Display IDs matter:
# calibration for one display/skin does not certify a different display.
[[guns]]
id = "tacz:glock_17"
display = "tacz:default"
pack = "base"
name = "Glock 17"
calibrated = false
notes = ""

# Another pack can share the same namespace. Link guns explicitly via pack.
# [[packs]]
# id = "my_pack"
# name = "My custom gun pack"
# [[guns]]
# id = "example:my_pistol"
# display = "tacz:default"
# pack = "my_pack"
# name = "My pistol"
# calibrated = true
# notes = "Grip, muzzle and reload zones checked"

