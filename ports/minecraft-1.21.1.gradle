// Shared Mojang-mapped 1.21.1 changes. Loader adapters apply this after their own transforms.
ext.minecraft121Transform = { String text, File source ->
    String helper = 'dev.visorcompat.tacz.compat.StackData'
    // Rewrite mutations before reads: CustomData.copyTag() is a snapshot, never a writable view.
    text = text.replaceAll(/([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\.(?:getOrCreateTag|getTag)\(\)\.(putBoolean|putInt|putString|remove)\(/) { all, receiver, method ->
        "${helper}.${method}(${receiver},"
    }
    text = text.replaceAll(/([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\.hasTag\(\)/) { all, receiver -> "${helper}.has(${receiver})" }
    text = text.replaceAll(/([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\.(?:getOrCreateTag|getTag)\(\)/) { all, receiver -> "${helper}.read(${receiver})" }
    // Count only top-level constructor arguments, including calls nested inside arguments.
    def pattern = ~/(?:new\s+)((?:net\.minecraft\.resources\.)?ResourceLocation)\s*\(/
    def matcher = pattern.matcher(text)
    def replacements = []
    while (matcher.find()) {
        int depth = 1, commas = 0, end = matcher.end()
        boolean quoted = false, escaped = false
        for (; end < text.length() && depth > 0; end++) {
            char c = text.charAt(end)
            if (quoted) {
                if (escaped) escaped = false
                else if (c == '\\') escaped = true
                else if (c == '"') quoted = false
            } else if (c == '"') quoted = true
            else if (c == '(') depth++
            else if (c == ')') depth--
            else if (c == ',' && depth == 1) commas++
        }
        if (depth != 0 || commas > 1) throw new GradleException("Unrecognized ResourceLocation constructor in ${source}")
        replacements << [matcher.start(), matcher.end(), matcher.group(1) + (commas == 0 ? '.parse(' : '.fromNamespaceAndPath(')]
    }
    replacements.reverseEach { r -> text = text.substring(0,r[0]) + r[2] + text.substring(r[1]) }
    text = text.replace('.getFrameTime()', '.getTimer().getGameTimeDeltaPartialTick(true)')
    // Packet transports must provide RegistryFriendlyByteBuf for registry-aware item components.
    // OPTIONAL_STREAM_CODEC retains the old writeItem/readItem representation of empty stacks.
    text = text.replaceAll(/([A-Za-z_$][\w$]*)\.readItem\(\)/) { all, buffer ->
        "net.minecraft.world.item.ItemStack.OPTIONAL_STREAM_CODEC.decode((net.minecraft.network.RegistryFriendlyByteBuf)${buffer})"
    }
    text = text.replaceAll(/([A-Za-z_$][\w$]*)\.writeItem\(/) { all, buffer ->
        "net.minecraft.world.item.ItemStack.OPTIONAL_STREAM_CODEC.encode((net.minecraft.network.RegistryFriendlyByteBuf)${buffer},"
    }
    if (source.name == 'StatusPanel.java') {
        text = text.replace('.vertex(', '.addVertex(').replace('.color(', '.setColor(').replace('.uv2(', '.setLight(').replace('.endVertex()', '')
    }
    if ((text =~ /\.(getOrCreateTag|getTag|hasTag)\(/).find()
        || (text =~ /StackData\.read\([^;\n]*?\)\.(put\w*|remove)\(/).find()) {
        throw new GradleException("Unmigrated or non-persistent ItemStack NBT access in ${source}")
    }
    return text
}

ext.minecraft121HelperSource = '''package dev.visorcompat.tacz.compat;

import net.minecraft.core.component.DataComponents;
import net.minecraft.nbt.CompoundTag;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.component.CustomData;

/** Compatibility state lives in CUSTOM_DATA; each mutation persists a fresh component. */
public final class StackData {
    private StackData() {}
    public static boolean has(ItemStack stack) {
        CustomData data = stack.get(DataComponents.CUSTOM_DATA);
        return data != null && !data.isEmpty();
    }
    public static CompoundTag read(ItemStack stack) {
        return stack.getOrDefault(DataComponents.CUSTOM_DATA, CustomData.EMPTY).copyTag();
    }
    public static void putBoolean(ItemStack stack, String key, boolean value) {
        CustomData.update(DataComponents.CUSTOM_DATA, stack, tag -> tag.putBoolean(key, value));
    }
    public static void putInt(ItemStack stack, String key, int value) {
        CustomData.update(DataComponents.CUSTOM_DATA, stack, tag -> tag.putInt(key, value));
    }
    public static void putString(ItemStack stack, String key, String value) {
        CustomData.update(DataComponents.CUSTOM_DATA, stack, tag -> tag.putString(key, value));
    }
    public static void remove(ItemStack stack, String key) {
        CustomData.update(DataComponents.CUSTOM_DATA, stack, tag -> tag.remove(key));
    }
}
'''

// Optional dependency-free runtime regression test against each loader's real Minecraft classes.
ext.minecraft121InstallTests = {
    sourceSets.test.java.srcDir(file('../ports/test/java'))
    tasks.register('testStackData', JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.visorcompat.tacz.compat.StackDataPersistenceTest'
    }
    tasks.named('check') { dependsOn 'testStackData' }
}
